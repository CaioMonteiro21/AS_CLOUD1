name: Deploy Azure Function - Galeria de Artes

on:
  push:
    branches:
      - main
    paths:
      - 'ArtGalleryFunction/**'
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: 'fa-galeriadeartes'
  AZURE_FUNCTION_FOLDER: 'ArtGalleryFunction'
  PYTHON_VERSION: '3.10'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Dependências
        working-directory: ${{ env.AZURE_FUNCTION_FOLDER }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Necessário para Azure Functions Python
          pip install --target="./.python_packages/lib/site-packages" -r requirements.txt

      - name: Deploy da Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.AZURE_FUNCTION_FOLDER }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
