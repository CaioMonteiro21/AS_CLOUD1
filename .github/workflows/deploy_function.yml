name: Deploy Azure Function - fa-galeriadeartes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTION_FOLDER: 'ArtGalleryFunction'  # pasta da sua Function App
  PYTHON_VERSION: '3.10'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 3️⃣ Instalar dependências
      - name: Install dependencies
        working-directory: ${{ env.AZURE_FUNCTION_FOLDER }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --target="./.python_packages/lib/site-packages" -r requirements.txt

      # 4️⃣ Criar pacote ZIP
      - name: Create zip package
        working-directory: ${{ env.AZURE_FUNCTION_FOLDER }}
        run: |
          zip -r ../function.zip .

      # 5️⃣ Deploy via publish profile
      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: 'fa-galeriadeartes'
          package: './function.zip'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
