name: Deploy Azure Function - Galeria de Artes

on:
  push:
    branches: [ main ]
    paths:
      - 'ArtGalleryFunction/**'
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: 'fa-galeriadeartes'
  AZURE_FUNCTION_FOLDER: 'ArtGalleryFunction'
  PYTHON_VERSION: '3.10'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        working-directory: ${{ env.AZURE_FUNCTION_FOLDER }}
        run: |
          python -m pip install --upgrade pip
          pip install --target="./.python_packages/lib/site-packages" -r requirements.txt

      - name: Deploy Azure Function (ZipDeploy)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.AZURE_FUNCTION_FOLDER }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
